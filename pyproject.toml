[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nearest-exit"
version = "0.0.1"
description = "Measure VPN relays from your own network and rank them yourself, instead of trusting the provider's recommendation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "faeton" }]
keywords = [
    "vpn", "mullvad", "nordvpn", "airvpn", "pia", "wireguard", "openvpn",
    "latency", "ping", "jitter", "packet-loss", "relay", "server-selection",
    "benchmark", "network-measurement", "socks5", "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: System :: Networking",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
nearest-exit = "nearest_exit.cli:main"

[project.urls]
Homepage = "https://github.com/faeton/nearest-exit"
Documentation = "https://github.com/faeton/nearest-exit#readme"
Changelog = "https://github.com/faeton/nearest-exit/blob/main/CHANGELOG.md"
Issues = "https://github.com/faeton/nearest-exit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nearest_exit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
